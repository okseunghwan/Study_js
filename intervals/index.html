<body>

  <form class="hidden" id="login-form">

  </form>
  <h2 id="clock">00:00</h2>
  <h1 id="greeting" class="hidden"></h1>
  <!-- input의 유효성 검사를 작동시키기 위해서는 input은 form안에있어야한다. -->





  <script src="js/greeting.js"></script>
  <script src="js/clock.js"></script>
